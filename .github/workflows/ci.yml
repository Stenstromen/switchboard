name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go
        run: |
          mkdir -p frontend/dist
          printf '%s\n' '<!doctype html><html><body><div id="root"></div></body></html>' > frontend/dist/index.html
          go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test UI
        working-directory: frontend
        run: |
          npm ci
          npm test
